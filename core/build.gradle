[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

configurations {
  miniaudioDesktopNatives
}

dependencies {
  api "com.badlogicgames.ashley:ashley:$ashleyVersion"
  api "com.badlogicgames.gdx-controllers:gdx-controllers-core:$gdxControllersVersion"
  api "com.badlogicgames.gdx:gdx-ai:$aiVersion"
  api "com.badlogicgames.gdx:gdx-bullet:$gdxVersion"
  api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  api "games.rednblack.miniaudio:miniaudio:$miniaudioVersion"
  // Gradle module metadata drops the classifier on this dependency. Bundle the native
  // artifact into core below so downstream projects get the DLLs/SOs from this JAR.
  miniaudioDesktopNatives "games.rednblack.miniaudio:gdx-miniaudio-platform:$miniaudioVersion:natives-desktop"

  api "com.github.mgsx-dev.gdx-gltf:gltf:2.3.0"
  api 'com.crashinvaders.vfx:gdx-vfx-core:0.5.4'
  api 'com.crashinvaders.vfx:gdx-vfx-effects:0.5.4'
  api files('libs/Effekseer.jar')

  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }
}

// Bundle the Effekseer JNI library as a core resource so it is published with the module.
processResources {
    from(rootProject.file('assets/EffekseerNativeForJava.dll')) {
        into 'native/windows-x86_64'
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(zipTree('libs/Effekseer.jar'))
    from { configurations.miniaudioDesktopNatives.collect { zipTree(it) } }
    exclude('META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA')
}
